<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden}
.stage{position:relative;height:100%;background:transparent}
.pocket{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:56%;max-width:520px;height:46%;background:#9DBFD2;border-radius:6px 6px 0 0;box-shadow:0 -6px 30px rgba(38,34,27,0.14);z-index:3}
.pocket .tab{position:absolute;left:8%;top:-24px;width:30%;height:24px;background:#9DBFD2;border-radius:10px 10px 0 0}
.pocket::before{content:none}
.pocket .label{position:absolute;left:7%;top:14%;font-family:'Special Elite',monospace;font-size:12px;color:#28425A;line-height:1.7}
.pocket .num{position:absolute;right:8%;top:14%;font-family:'Special Elite',monospace;font-size:15px;color:#28425A}
.pocket .stamp{position:absolute;left:7%;bottom:16%;font-family:'Special Elite',monospace;font-size:10.5px;color:#48657E;letter-spacing:0.08em}
.card{position:absolute;left:50%;bottom:44%;transform:translateX(-50%) rotate(-1.2deg);width:47%;max-width:440px;z-index:2;transition:transform .28s ease}
body.hop .card{transform:translateX(-50%) translateY(-10px) rotate(-3.6deg)}
.card img{display:block;width:100%;border-radius:8px 8px 0 0;border:1px solid rgba(255,255,255,0.8);box-shadow:0 18px 44px rgba(2,60,84,0.22)}
.chip{position:absolute;right:11%;top:12%;display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:8px 14px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;color:#026C96;box-shadow:0 10px 26px rgba(38,34,27,0.14);z-index:4}
.paper-tag{position:absolute;left:7%;top:7%;font-family:'Special Elite',monospace;font-size:11.5px;color:#6E6455;transform:rotate(-3deg);z-index:4}
</style></head><body><div class="stage">
<p class="paper-tag">paper claim, 1986 —</p>
<span class="chip"><span style="width:8px;height:8px;border-radius:50%;background:#2E9E63"></span>— digital, live status</span>
<div class="card"><img src="../images/cover-src-vbg.png" alt=""></div>
<div class="pocket">
<span class="tab"></span>
<p class="label">VA Form 21-526EZ<br>c.1&nbsp;&nbsp;&nbsp;Disability compensation<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;claim &amp; records</p>
<p class="num">145805</p>
<p class="stamp">FILED&nbsp;&nbsp;16 MAR 86&nbsp;&nbsp;·&nbsp;&nbsp;S12206</p>
</div>
</div></body></html>
