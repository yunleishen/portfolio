<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
svg{position:absolute;inset:0;width:100%;height:100%}
.float{animation:fl 5.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.f2{animation-duration:7s;animation-delay:-2.5s}
.f3{animation-duration:6s;animation-delay:-1.2s}
@keyframes fl{from{transform:translateY(-5px) rotate(-1deg)}to{transform:translateY(5px) rotate(1deg)}}
.pulse{animation:pu 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
text{font-family:'Oswald',sans-serif;font-weight:500}
.hand{font-family:'Caveat',cursive;font-weight:600}
</style></head><body>
<svg viewBox="0 0 900 560" fill="none" preserveAspectRatio="xMidYMid meet" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
    </filter>
  </defs>
  <g filter="url(#rough)">

  <!-- ===== floating social icons (left side) ===== -->
  <g class="float">
    <!-- like heart in bubble -->
    <g transform="translate(128 96) rotate(-8)">
      <path d="M0 0 h84 q12 0 12 12 v40 q0 12 -12 12 h-52 l-16 16 2 -16 h-18 q-12 0 -12 -12 v-40 q12 -12 12 -12 Z" transform="translate(-14 -12)" fill="#FBF8F1" stroke="#141414" stroke-width="3.5"/>
      <path class="pulse" d="M28 12 C 22 4, 8 6, 7 16 C 6 26, 18 34, 28 41 C 38 34, 50 26, 49 16 C 48 6, 34 4, 28 12 Z" fill="#D96A55" stroke="#141414" stroke-width="3"/>
      <text class="hand" x="62" y="34" font-size="26" fill="#141414">12k</text>
    </g>
    <!-- comment bubble -->
    <g transform="translate(96 258) rotate(5)">
      <path d="M8 0 h72 q14 0 14 14 v28 q0 14 -14 14 h-40 l-20 18 4 -18 h-16 q-14 0 -14 -14 v-28 q0 -14 14 -14 Z" fill="#B9A3E8" stroke="#141414" stroke-width="3.5"/>
      <circle cx="30" cy="28" r="3.5" fill="#141414"/><circle cx="50" cy="28" r="3.5" fill="#141414"/><circle cx="70" cy="28" r="3.5" fill="#141414"/>
    </g>
    <!-- play / video -->
    <g transform="translate(168 396)" class="pulse-wrap">
      <g class="pulse"><circle cx="0" cy="0" r="34" fill="#D9A036" stroke="#141414" stroke-width="3.5"/>
      <path d="M-9 -15 L 17 0 L -9 15 Z" fill="#141414"/></g>
    </g>
    <!-- views / eye -->
    <g transform="translate(92 494) rotate(-6)">
      <path d="M0 0 C 18 -20, 54 -20, 72 0 C 54 20, 18 20, 0 0 Z" fill="#FBF8F1" stroke="#141414" stroke-width="3.5"/>
      <circle cx="36" cy="0" r="9" fill="#6B5CD6" stroke="#141414" stroke-width="3"/>
      <text class="hand" x="82" y="10" font-size="26" fill="#141414">98k</text>
    </g>
  </g>

  <!-- ===== floating social logos (right side) ===== -->
  <g class="f2 float">
    <!-- instagram -->
    <g transform="translate(742 92) rotate(7)">
      <rect x="0" y="0" width="66" height="66" rx="20" fill="#E9D7EE" stroke="#141414" stroke-width="3.5"/>
      <circle cx="33" cy="33" r="15" stroke="#141414" stroke-width="3.5"/>
      <circle cx="52" cy="14" r="4" fill="#141414"/>
    </g>
    <!-- tiktok note -->
    <g transform="translate(786 250) rotate(-9)">
      <circle cx="30" cy="30" r="38" fill="#141414"/>
      <path d="M26 44 a10 10 0 1 1 -10 -10 l 4 0 L 20 12 c 6 1 10 5 18 6 l 0 9 c -6 -1 -9 -2 -12 -4 Z" fill="#FBF8F1" stroke="#5EE0DC" stroke-width="2"/>
    </g>
    <!-- facebook -->
    <g transform="translate(756 396) rotate(6)"><g class="f3 float">
      <circle cx="32" cy="32" r="34" fill="#8B7BD8" stroke="#141414" stroke-width="3.5"/>
      <path d="M40 14 c -10 -2 -16 3 -16 12 l 0 8 -8 0 0 10 8 0 0 22 11 0 0 -22 9 0 2 -10 -11 0 0 -6 c 0 -4 2 -5 5 -5 Z" fill="#FBF8F1" stroke="#141414" stroke-width="2"/>
    </g></g>
    <!-- little sparkles -->
    <path d="M700 520 l0 22 M 689 531 l22 0" stroke="#D9A036" stroke-width="5"/>
    <path d="M842 512 l4 11 11 1 -9 8 3 12 -10 -7 -11 6 4 -11 -8 -8 11 0 Z" fill="#F2ECE2" stroke="#141414" stroke-width="3"/>
  </g>

  <!-- burst over phone corner -->
  <path d="M586 34 l11 -15 M 607 47 l15 -9 M 614 70 l17 -3" stroke="#141414" stroke-width="4"/>

  <!-- ===== phone (slight tilt) ===== -->
  <g class="float" transform="rotate(-3 448 280)">
    <rect x="322" y="34" width="252" height="492" rx="38" fill="#B9A3E8" stroke="#141414" stroke-width="4"/>
    <rect x="338" y="50" width="220" height="460" rx="24" fill="#E9D7EE" stroke="#141414" stroke-width="3"/>
    <rect x="412" y="64" width="76" height="15" rx="7.5" fill="#141414"/>
    <path d="M528 76 a12 12 0 0 1 17 0 M 532 82 a7 7 0 0 1 9 0" stroke="#141414" stroke-width="3"/><circle cx="536.5" cy="88" r="1.8" fill="#141414"/>

    <!-- header: scribble title + avatar -->
    <rect x="352" y="102" width="128" height="26" fill="#C6B8AE" stroke="#141414" stroke-width="2.5"/>
    <path d="M360 115 c4 -5 7 5 11 0 c4 -5 7 5 11 0 m8 0 c4 -5 7 5 11 0 c4 -5 7 5 11 0 m9 0 c4 -5 7 5 11 0" stroke="#141414" stroke-width="2.2"/>
    <circle cx="522" cy="115" r="17" fill="#FBF8F1" stroke="#141414" stroke-width="3"/>
    <circle cx="522" cy="110" r="5.5" fill="#6B5CD6"/><path d="M512 124 c2 -7 18 -7 20 0" fill="#6B5CD6"/>

    <!-- squiggle copy lines -->
    <path d="M354 144 h16 M 354 150 h16 M 354 156 h12" stroke="#141414" stroke-width="2"/>
    <path d="M382 152 c4 -6 8 6 12 0 c4 -6 8 6 12 0 m8 0 c4 -6 8 6 12 0" stroke="#141414" stroke-width="2.4"/>
    <path d="M520 146 h24 M 524 152 h20 M 528 158 h16" stroke="#141414" stroke-width="2"/>

    <!-- business photo card -->
    <rect x="352" y="172" width="192" height="98" fill="#F2ECC4" stroke="#141414" stroke-width="3"/>
    <rect x="352" y="172" width="192" height="30" fill="#C4ADE9" stroke="#141414" stroke-width="3"/>
    <path d="M488 190 l-5 -9 M 497 188 l0 -10 M 506 190 l5 -9" stroke="#141414" stroke-width="2.8"/>
    <path d="M452 236 h74 c-2 16 -12 24 -37 24 c-25 0 -35 -8 -37 -24 Z" fill="#8A8578" stroke="#141414" stroke-width="3"/>
    <path d="M458 236 c8 -6 18 -9 31 -9 c13 0 23 3 31 9 Z" fill="#D9A036" stroke="#141414" stroke-width="2.5"/>
    <circle cx="478" cy="232" r="4" fill="#B65E43"/><circle cx="494" cy="230" r="4" fill="#B65E43"/><circle cx="510" cy="232" r="4" fill="#B65E43"/>
    <path d="M492 232 L 512 196 M 502 233 L 518 198" stroke="#141414" stroke-width="3"/>
    <path d="M404 218 l4 42 h22 l4 -42 Z" fill="#EDE6F5" stroke="#141414" stroke-width="3"/>
    <path d="M416 218 l6 -14" stroke="#141414" stroke-width="4"/>
    <path d="M408 232 l8 6 6 -7 7 7 M 409 244 l7 5 6 -6 7 6" stroke="#141414" stroke-width="2"/>
    <path d="M368 246 h26 c-1 9 -6 14 -13 14 c-7 0 -12 -5 -13 -14 Z" fill="#9BB05A" stroke="#141414" stroke-width="3"/>
    <ellipse cx="381" cy="246" rx="8" ry="3.5" fill="#B65E43" stroke="#141414" stroke-width="2"/>

    <!-- white deal card -->
    <path d="M338 296 q0 -14 14 -14 h192 q14 0 14 14 v214 h-220 Z" fill="#FBF8F1" stroke="#141414" stroke-width="3"/>
    <text x="358" y="325" font-size="21" letter-spacing="3" fill="#141414">PICK A TIER:</text>
    <g>
      <circle cx="376" cy="366" r="19" fill="#D96A55" stroke="#141414" stroke-width="3.5"/>
      <text x="376" y="373" text-anchor="middle" font-size="17" letter-spacing="0.5" fill="#141414">DM</text>
      <path d="M361 382 L 391 350" stroke="#141414" stroke-width="3.5"/>
    </g>
    <circle cx="424" cy="366" r="19" fill="#E7D9F6" stroke="#141414" stroke-width="3"/>
    <text x="424" y="374" text-anchor="middle" font-size="19" fill="#141414">1</text>
    <circle cx="472" cy="366" r="19" fill="#E7D9F6" stroke="#141414" stroke-width="3"/>
    <text x="472" y="374" text-anchor="middle" font-size="19" fill="#141414">2</text>
    <circle cx="520" cy="366" r="19" fill="#E7D9F6" stroke="#141414" stroke-width="3"/>
    <text x="520" y="374" text-anchor="middle" font-size="19" fill="#141414">3</text>

    <!-- deal checklist panel -->
    <rect x="352" y="398" width="192" height="76" fill="#C9B4EC" stroke="#141414" stroke-width="3"/>
    <g font-size="14" letter-spacing="1.5" fill="#141414">
      <rect x="362" y="406" width="12" height="12" fill="#FBF8F1" stroke="#141414" stroke-width="2.2"/>
      <path d="M364 412 l4 4 6 -8" stroke="#141414" stroke-width="2.4"/>
      <text x="384" y="417">1 REEL</text>
      <rect x="362" y="429" width="12" height="12" fill="#FBF8F1" stroke="#141414" stroke-width="2.2"/>
      <path d="M364 435 l4 4 6 -8" stroke="#141414" stroke-width="2.4"/>
      <text x="384" y="440">2 STORIES</text>
      <rect x="362" y="452" width="12" height="12" fill="#FBF8F1" stroke="#141414" stroke-width="2.2"/>
      <text x="384" y="463">FREE MEAL</text>
      <text x="462" y="417" font-size="12" fill="#4B3E75">▶ NO CHAT</text>
      <text x="462" y="440" font-size="12" fill="#4B3E75">▶ ~2 MIN</text>
    </g>

    <!-- confirm CTA -->
    <rect x="352" y="484" width="192" height="26" fill="#D96A55" stroke="#141414" stroke-width="3"/>
    <text x="448" y="502" text-anchor="middle" font-size="14" letter-spacing="2.5" fill="#FBF8F1">CONFIRM DEAL</text>

    <!-- ===== hand holding phone: palm at right, fingers wrap edge, thumb taps CONFIRM ===== -->
    <!-- wrist / forearm to bottom edge -->
    <path d="M 648 540 C 656 508 680 486 714 484 C 748 482 776 502 788 540 L 796 560 L 644 560 Z" fill="#DFA163" stroke="#141414" stroke-width="4"/>
    <!-- palm mass right of the phone -->
    <path d="M 600 372 C 636 352 686 356 716 388 C 748 422 754 478 730 512 C 706 546 654 548 618 524 C 588 504 578 466 584 428 C 588 404 592 386 600 372 Z" fill="#DFA163" stroke="#141414" stroke-width="4"/>
    <!-- four fingers wrapping over the phone edge -->
    <g fill="#DFA163" stroke="#141414" stroke-width="3.5">
      <path d="M571 345 H613 A15 15 0 0 1 613 375 H571 A15 15 0 0 1 571 345 Z"/>
      <path d="M563 384 H621 A15 15 0 0 1 621 414 H563 A15 15 0 0 1 563 384 Z"/>
      <path d="M567 424 H623 A15 15 0 0 1 623 454 H567 A15 15 0 0 1 567 424 Z"/>
      <path d="M577 464 H619 A15 15 0 0 1 619 494 H577 A15 15 0 0 1 577 464 Z"/>
    </g>
    <!-- fingernails -->
    <g fill="#F3CDB3" stroke="#141414" stroke-width="2.2">
      <ellipse cx="562" cy="362" rx="7.5" ry="9"/>
      <ellipse cx="554" cy="402" rx="7.5" ry="9"/>
      <ellipse cx="558" cy="442" rx="7.5" ry="9"/>
      <ellipse cx="568" cy="482" rx="7.5" ry="9"/>
    </g>
    <!-- thumb from palm bottom, tapping CONFIRM -->
    <path d="M 612 528 C 580 526 528 516 496 505 C 480 499 482 481 500 480 C 534 479 586 490 620 502 C 638 508 636 526 612 528 Z" fill="#DFA163" stroke="#141414" stroke-width="4"/>
    <ellipse cx="502" cy="492" rx="11" ry="8.5" transform="rotate(8 502 492)" fill="#F3CDB3" stroke="#141414" stroke-width="2.5"/>
    <!-- palm creases -->
    <path d="M 662 470 c 8 10 12 22 13 36 M 690 460 c 10 12 15 26 15 42" stroke="#141414" stroke-width="3"/>
    <!-- tap ripple at thumb -->
    <path class="pulse" d="M 470 470 a 26 26 0 0 1 10 -28 M 458 452 a 42 42 0 0 1 16 -36" stroke="#141414" stroke-width="3"/>
  </g>
  </g>
</svg>
</body></html>
