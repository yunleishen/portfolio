<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:'Poppins',sans-serif}
.stage{position:relative;height:100%;background:transparent}
.grid{position:absolute;left:52%;right:0;top:0;bottom:0;background-image:linear-gradient(rgba(15,122,120,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(15,122,120,0.08) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent,#000 22%)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:500;color:#3E3930;box-shadow:0 10px 28px rgba(38,34,27,0.14)}
.mess{background:#F1EDE4;color:#8A8171;box-shadow:0 6px 16px rgba(38,34,27,0.10);transition:all .55s cubic-bezier(.22,.9,.3,1.1)}
svg.tangle{transition:opacity .4s ease}
body.order svg.tangle{opacity:0}
body.order .m1{left:8% !important;top:16% !important;transform:rotate(0deg) !important}
body.order .m2{left:8% !important;top:33% !important;transform:rotate(0deg) !important}
body.order .m3{left:8% !important;top:50% !important;transform:rotate(0deg) !important;opacity:0 !important}
body.order .m4{left:8% !important;top:50% !important;transform:rotate(0deg) !important;opacity:0 !important}
body.order .m5{left:8% !important;top:50% !important;transform:rotate(0deg) !important}
body.order .m6{left:8% !important;top:67% !important;transform:rotate(0deg) !important}
.mess{opacity:1}
.rchip{transition:transform .55s cubic-bezier(.22,.9,.3,1.1)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.rchip,.mid{animation:bob 3.6s ease-in-out infinite}
.rchip:nth-of-type(odd){animation-delay:-1.8s}
.mid{animation-delay:-0.9s;transition:transform .55s cubic-bezier(.22,.9,.3,1.1)}
.two{animation:bob 3.6s ease-in-out infinite;animation-delay:-2.7s;transition:transform .55s cubic-bezier(.22,.9,.3,1.1)}
body:not(.order) .two{transform:rotate(3deg)}
body.order .two{transform:rotate(0) scale(1.06)}
body:not(.order) .r1{transform:rotate(-4deg) translateX(-6px)}
body:not(.order) .r2{transform:rotate(3deg) translateX(8px)}
body:not(.order) .r3{transform:rotate(-2.5deg) translateX(-9px)}
body:not(.order) .r4{transform:rotate(4deg) translateX(5px)}
body:not(.order) .mid{transform:rotate(-5deg)}
body.order .rchip{transform:rotate(0) translateX(0)}
body.order .mid{transform:rotate(0) scale(1.08)}
.dot{width:20px;height:20px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.strike{text-decoration:line-through;text-decoration-color:#C0574F}
svg.tangle{position:absolute;left:4%;top:18%;width:38%;height:64%;overflow:visible}
</style></head><body><div class="stage">
<div class="grid"></div>
<svg class="tangle" viewBox="0 0 200 260" fill="none"><path d="M18 30 C 90 10, 30 120, 120 96 S 40 210, 150 190 S 60 250, 170 236" stroke="rgba(138,129,113,0.5)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/></svg>
<span class="chip mess m1" style="left:6%;top:14%;transform:rotate(-7deg)">Notes</span>
<span class="chip mess m2" style="left:20%;top:23%;transform:rotate(4deg);z-index:1">Activity</span>
<span class="chip mess m3" style="left:9%;top:36%;transform:rotate(-3deg)">Notes, again</span>
<span class="chip mess strike m4" style="left:24%;top:47%;transform:rotate(8deg)">Quotes?</span>
<span class="chip mess m5" style="left:5%;top:58%;transform:rotate(5deg)">Targets</span>
<span class="chip mess m6" style="left:21%;top:70%;transform:rotate(-6deg)">3–5 clicks deep</span>
<span class="chip mid" style="left:41%;top:44%;color:#0F7A78;border:1px solid rgba(15,122,120,0.3);z-index:2">→ one IA</span>
<span class="chip rchip r1" style="right:13%;top:16%"><span class="dot" style="background:#0F7A78">L</span>Leads</span>
<span class="chip rchip r2" style="right:13%;top:33%"><span class="dot" style="background:#4B8FD9">A</span>Accounts</span>
<span class="chip rchip r3" style="right:13%;top:50%"><span class="dot" style="background:#7A6FB8">D</span>Documents</span>
<span class="chip rchip r4" style="right:13%;top:67%"><span class="dot" style="background:#E8B44B">C</span>Claims</span>
<span class="chip two" style="right:13%;bottom:9%;color:#0F7A78;border:1px solid rgba(15,122,120,0.3);background:transparent;box-shadow:none">2 clicks to anything</span>
</div></body></html>
