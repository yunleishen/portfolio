<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Geist:wght@300;400&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#FAF7F2}
.fit{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.scene{position:absolute;left:50%;top:50%;width:900px;height:560px;transform-origin:center center}
.pocket{position:absolute;left:198px;bottom:56px;width:504px;height:258px;background:#E8EDF4;border:1px solid #E3DED6;border-radius:0;box-shadow:none;box-sizing:border-box;z-index:3}
.pocket .tab{position:absolute;left:40px;top:-25px;width:151px;height:25px;background:#E8EDF4;border:1px solid #E3DED6;border-bottom:none;border-radius:0;box-sizing:border-box}
.pocket .label{position:absolute;left:35px;top:36px;margin:0;font-family:'Special Elite',monospace;font-size:12px;color:#141414;line-height:1.7}
.pocket .num{position:absolute;right:40px;top:36px;margin:0;font-family:'Special Elite',monospace;font-size:15px;color:#141414}
.pocket .stamp{position:absolute;left:35px;bottom:41px;margin:0;font-family:'Special Elite',monospace;font-size:10.5px;color:#6B6560;letter-spacing:0.08em;white-space:nowrap}
.card{position:absolute;left:239px;bottom:246px;transform:rotate(-1.2deg);width:423px;z-index:2;transition:transform .28s ease}
body.hop .card{transform:translateY(-10px) rotate(-3.6deg)}
.card img{display:block;width:100%;border-radius:0;border:1px solid #E3DED6;box-shadow:none;box-sizing:border-box}
.chip{position:absolute;right:99px;top:67px;display:inline-flex;align-items:center;gap:7px;font-family:'Geist',sans-serif;font-size:11px;font-weight:300;color:#141414;z-index:4;white-space:nowrap}
.paper-tag{position:absolute;left:63px;top:39px;margin:0;font-family:'Special Elite',monospace;font-size:11.5px;color:#6B6560;transform:rotate(-3deg);z-index:4;white-space:nowrap}
</style></head><body><div class="fit"><div class="scene" id="scene">
<p class="paper-tag">paper claim, 1986 —</p>
<span class="chip"><span style="width:6px;height:6px;background:#1E3A5F;flex:none"></span>(digital — live status)</span>
<div class="card"><img src="./cover-src-vbg.png" alt=""></div>
<div class="pocket">
<span class="tab"></span>
<p class="label">VA Form 21-526EZ<br>c.1&nbsp;&nbsp;&nbsp;Disability compensation<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;claim &amp; records</p>
<p class="num">145805</p>
<p class="stamp">FILED&nbsp;&nbsp;16 MAR 86&nbsp;&nbsp;·&nbsp;&nbsp;S12206</p>
</div>
</div></div>
<script>
(function(){
  var scene=document.getElementById('scene');
  function fit(){
    var s=Math.min(window.innerWidth/756,window.innerHeight/492);
    scene.style.transform='translate(-50%,-50%) scale('+s+') translate(18px,8px)';
  }
  window.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  fit();
})();
</script>
</body></html>
